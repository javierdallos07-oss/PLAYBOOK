## Filming Checklist

Read this before every recording session.

### Before you hit record
- Breathe: 3 slow breaths, in through the nose, out through the mouth
- Shoulders back and down, chest open, chin level
- Smile before you start talking. Hold it for one second, then go.
- Phone at eye level, camera lens at your eyes, not below your chin
- Light in front of you (window or ring light), never behind you
- Clean background, lens wiped

### Camera angles
- **Talking head:** phone on a tripod at eye level, framed from mid chest up. Use for tips and money videos.
- **Walk and talk:** hold the phone at arm's length, slightly above eye level, walk slowly. Use for neighborhood videos.
- **Over the shoulder:** someone films from behind you as you point at a detail. Use for home inspection moments.
- **B-roll:** 3 second clips of doors, kitchens, streets, signs. Film 10 of these every session.

### Voice and delivery
- **Hook:** say it with energy, a little louder and faster
- **Body:** slow down, warm and calm, like explaining to a friend
- **Numbers:** pause right before a number so it lands
- **CTA:** smile, friendly and direct
- If you stumble, pause, breathe, start the sentence again. Cut it in editing.

## Gym

Tuesday is Session A, Thursday is Session B. Warm up 5 minutes first: arm circles, 10 kettlebell deadlifts, 10 bodyweight squats. Rest 60 seconds between sets. Pick a weight where the last 2 reps are hard but clean.

### Progression
| Week | Sets x reps | Plank hold |
|---|---|---|
| Week 1, Nov 16 | 3 x 10 | 3 x 30 sec |
| Week 2, Nov 23 | 3 x 12 | 3 x 40 sec |
| Week 3, Nov 30 | 4 x 10, go heavier | 3 x 45 sec |
| Week 4, Dec 7 | 4 x 12 | 3 x 60 sec |

Pull-ups: as many clean reps as you can each set.

### Session A (Tuesday) · 6 exercises
- **Seated shoulder press** (20 to 25 lb each): sit tall, press until arms are straight, lower to ear level.
- **Lateral raise** (10 to 15 lb): soft elbows, lift to shoulder height, lower slowly for 3 seconds.
- **Hammer curl** (20 to 25 lb): palms face each other, elbows pinned to your sides.
- **Overhead tricep press** (the 35 lb): both hands on one dumbbell, lower behind your head, elbows point up.
- **Decline sit-up:** hook your feet under the pads, lower slowly, curl up without pulling your neck. When it gets easy, hold the 20 lb on your chest.
- **Superman:** lie face down, lift arms, chest and legs together, hold 3 seconds at the top.

### Session B (Thursday) · 6 exercises
- **Pull-up:** start from a full hang, pull your chin over the bar. Can't do 5 yet? Jump up and lower slowly.
- **Dumbbell bench press** (35 lb, or the adjustables at 40 to 45): lower to chest level, press up, wrists straight.
- **Bent-over row** (the 35 lb, one arm at a time): flat back, pull the dumbbell to your hip.
- **Kettlebell swing:** hinge at the hips, snap them forward, arms just guide the bell to chest height. This one works your lower back.
- **Forearm plank:** straight line from head to heels, squeeze abs and glutes.
- **Hanging knee raise:** hang still, bring knees up to hip level, no swinging.

## Leads

Who sends them? GoHighLevel does. Once you build the workflow below, every new lead gets the messages automatically. Your only job is answering when someone replies.

### Build the workflow (one time, about 30 min)
1. Go to Automation, then Workflows, then Create Workflow, then Start from scratch.
2. Trigger: Form Submitted or Contact Created, with tag "new lead."
3. Add each step below with a Wait action between them.
4. Add a goal: if the lead replies, stop the workflow so they don't get canned messages after a real conversation.
5. Turn it on and test it with your own phone number.

### The 8 touches
- **Day 0 text:** Hi {first_name}, this is Javier Dallos. Thanks for reaching out! What's the best time for a quick call this week?
- **Day 0 email, Subject: Glad we connected:** Hi {first_name}, thanks so much for reaching out. I'll keep an eye out for homes that fit what you're looking for. When's a good time to chat for 10 minutes? Javier, 407-486-8034
- **Day 2 text:** Hi {first_name}, just checking in. Anything new on your end? Happy to set up showings when you're ready.

  function fmt(d, opts) { return d.toLocaleDateString("en-US", opts); }

  function pageToday() {
    var d = today(), dow = d.getDay(), wk = weekOf(d);
    var sub2;
    if (wk === 0 && plan.start) {
      var left = Math.round((plan.start - d) / 86400000);
      sub2 = "The plan starts " + fmt(plan.start, { weekday: "long", month: "short", day: "numeric" }) + " (" + left + " day" + (left === 1 ? "" : "s") + " away). Here's your standard " + DAY_NAMES[dow] + ".";
    } else if (wk === 99) sub2 = "The 4-week plan is finished. Here's your standard " + DAY_NAMES[dow] + ".";
    else if (wk) sub2 = "Week " + wk + ", day " + (Math.round((d - weekStart(wk)) / 86400000) + 1) + " of 7";
    pageHead(fmt(d, { weekday: "long", month: "long", day: "numeric" }), sub2);

    var week = wk >= 1 && wk < 99 ? S.weeks[wk] : null;
    var any = false;

    // Schedule
    if (S.schedule) {
      var blocks = sub(S.schedule, /./).filter(function (h) { return inRange(h.title, dow); });
      if (blocks.length) {
        any = true;
        main.appendChild(el("h3", null, "Schedule"));
        blocks.forEach(function (h) { renderHeading(h, d, main, 4); });
      }
    }
    // Gym (Tue = A, Thu = B)
    var letter = dow === 2 ? "A" : dow === 4 ? "B" : null;
    if (letter) {
      any = true;
      var re = new RegExp("session\\s*" + letter + "\\b", "i");
      main.appendChild(el("h3", null, "Gym: Session " + letter));
      var wgym = week ? sub(week, /gym/i)[0] : null;
      var parts = wgym ? sub(wgym, re) : [];
      if (parts.length) {
        sub(wgym, /warm/i).forEach(function (h) { renderHeading(h, d, main, 4); });
        parts.forEach(function (h) { renderHeading(h, d, main, 4); });
      } else {
        var pr = wk >= 1 && wk < 99 ? progressionRow(wk) : null;
        if (pr) main.appendChild(el("div", "note", pr.head.slice(1).map(function (h, i) { return esc(h) + ": " + esc(pr.row[i + 1] || ""); }).join(" · ")));
        var gparts = sub(S.gym, re);
        if (gparts.length) gparts.forEach(function (h) { renderHeading(h, d, main, 4); });
        else main.appendChild(el("p", "muted", "No Session " + letter + " found in the playbook."));
      }
    }
    // Meals
    if (week) {
      var menu = sub(week, /menu|meal/i)[0];
      var table = menu && menu.children.filter(function (c) { return c.type === "table"; })[0];
      var rows = table ? table.rows.filter(function (r) { return dayMatch(r[0], dow); }) : [];
      if (rows.length) {
        any = true;
        main.appendChild(el("h3", null, "Meals"));
        renderTable(table, menu, d, main, rows);
      }
      // Video script
      var content = sub(week, /content|script/i)[0];
      var scripts = content ? sub(content, /./).filter(function (h) { return dayMatch(h.title, dow); }) : [];
      if (scripts.length) {
        any = true;
        main.appendChild(el("h3", null, "Today's video"));
        scripts.forEach(function (h) { renderCard(h, d, main); });
      }
    }
    if (!any) main.appendChild(el("p", "muted", "Nothing scheduled in the playbook for today."));
    if (wk >= 1 && wk < 99) resetButton(wk);

    if (S.schedule) {
      var det = el("details", "more");
      det.appendChild(el("summary", null, "Full standard week"));
      var inner = el("div"); det.appendChild(inner);
      renderBlocks(S.schedule, d, inner);
      main.appendChild(det);
    }
  }
  function pageWeek(n) {
    var node = S.weeks[n], ws = weekStart(n);
    var title = node ? node.title : "Week " + n;
    pageHead(title, ws && !/\d/.test(title.replace(/^week\s*\d+/i, "")) ? fmt(ws, { month: "short", day: "numeric" }) + " to " + fmt(addDays(ws, 6), { month: "short", day: "numeric" }) : "");
    if (!node) { main.appendChild(el("p", "muted", "There's no Week " + n + " section in playbook.md yet.")); return; }
    var d = today();
    renderBlocks(node, d, main);
    if (!sub(node, /gym/i).length && S.gym) {
      var pr = progressionRow(n);
      main.appendChild(el("h3", null, "Gym"));
      main.appendChild(el("p", null, "Tuesday is Session A, Thursday is Session B. See the Gym tab for the exercises."));
      if (pr) main.appendChild(el("div", "note", pr.head.slice(1).map(function (h, i) { return esc(h) + ": " + esc(pr.row[i + 1] || ""); }).join(" · ")));
    }
    resetButton(n);
  }
  function pageSection(node, fallback, subtitle) {
    if (!node) { pageHead(fallback); main.appendChild(el("p", "muted", "No \"" + fallback + "\" section in playbook.md.")); return; }
    pageHead(node.title, subtitle);
    renderBlocks(node, today(), main);
  }

  /* ---------- tabs ---------- */
  var tabs = [
    { id: "today", label: "Today", render: pageToday },
    { id: "week-1", label: "Week 1", render: function () { pageWeek(1); } },
    { id: "week-2", label: "Week 2", render: function () { pageWeek(2); } },
    { id: "week-3", label: "Week 3", render: function () { pageWeek(3); } },
    { id: "week-4", label: "Week 4", render: function () { pageWeek(4); } },
    { id: "gym", label: "Gym", render: function () { pageSection(S.gym, "Gym", "Checkmarks here reset each week."); } },
    { id: "filming", label: "Filming Checklist", render: function () { pageSection(S.filming, "Filming Checklist", "Checkmarks here reset each week."); } },
    { id: "leads", label: "Leads", render: function () { pageSection(S.leads, "Leads"); } },
    { id: "tasks", label: "Tasks", render: function () { pageSection(S.tasks, "Tasks"); } }
  ];
  S.extra.forEach(function (n, i) { tabs.push({ id: "extra-" + i, label: n.title, render: function () { pageSection(n, n.title); } }); });

  var nav = document.getElementById("tabs");
  var current = "today";
  try { var saved = localStorage.getItem(TAB_KEY); if (saved && tabs.some(function (t) { return t.id === saved; })) current = saved; } catch (e) {}
  tabs.forEach(function (t) {
    var b = el("button", null, esc(t.label));
    b.type = "button"; b.setAttribute("role", "tab"); b.dataset.id = t.id;
    b.addEventListener("click", function () { show(t.id); window.scrollTo(0, 0); });
    nav.appendChild(b);
  });
  function show(id) {
    current = id;
    try { localStorage.setItem(TAB_KEY, id); } catch (e) {}
    nav.querySelectorAll("button").forEach(function (b) {
      var on = b.dataset.id === id;
      b.setAttribute("aria-selected", on ? "true" : "false");
      if (on && b.scrollIntoView) b.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
    main.innerHTML = "";
    var tab = tabs.filter(function (t) { return t.id === id; })[0] || tabs[0];
    tab.render();
    updateProgress();
  }

  // Re-draw when the app comes back the next day.
  var shownDay = iso(today());
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && iso(today()) !== shownDay) { shownDay = iso(today()); show(current); }
  });
  show(current);
})();
</script>
</body>
</html>
